<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MongoDB User Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f2f2f2;
        }

        .message {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>User Data Application</h1>

    <!-- Add Data -->

    <h2>Add Data</h2>

    <label for="userId">
        User ID
    </label>

    <input
        type="text"
        id="userId"
        placeholder="Enter your ID"
    >

    <label for="data">
        Data
    </label>

    <textarea
        id="data"
        placeholder="Enter the data you want to save"
    ></textarea>

    <button onclick="addData()">
        Save Data
    </button>

    <div
        id="addMessage"
        class="message"
    ></div>

    <hr>

    <!-- Fetch Data -->

    <h2>Get Data</h2>

    <label for="searchUserId">
        User ID
    </label>

    <input
        type="text"
        id="searchUserId"
        placeholder="Enter ID to search"
    >

    <button onclick="fetchData()">
        Get My Data
    </button>

    <div
        id="fetchResult"
        class="result"
    ></div>

</div>


<script>

async function addData() {

    const userId =
        document.getElementById("userId").value.trim();

    const data =
        document.getElementById("data").value.trim();

    const messageElement =
        document.getElementById("addMessage");


    // Validate input

    if (!userId || !data) {

        messageElement.textContent =
            "Please enter both ID and data.";

        return;
    }


    try {

        // Send data to backend

        const response = await fetch("/add-data", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                userId: userId,
                data: data
            })

        });


        const result =
            await response.json();


        // Successful response

        if (response.ok) {

            messageElement.textContent =
                "Data saved successfully!";

            document.getElementById("data").value = "";

        }

        // Error response

        else {

            messageElement.textContent =
                result.message ||
                "Failed to save data.";

        }

    }

    catch (error) {

        console.error(
            "Error:",
            error
        );

        messageElement.textContent =
            "Could not connect to server.";

    }

}


async function fetchData() {

    const userId =
        document
            .getElementById("searchUserId")
            .value
            .trim();

    const resultElement =
        document.getElementById("fetchResult");


    // Validate user ID

    if (!userId) {

        resultElement.textContent =
            "Please enter a user ID.";

        return;
    }


    try {

        // Request data from backend

        const response =
            await fetch(
                `/fetch-data/${encodeURIComponent(userId)}`
            );


        const result =
            await response.json();


        // Handle backend error

        if (!response.ok) {

            resultElement.textContent =
                result.message ||
                "Failed to fetch data.";

            return;
        }


        // No data found

        if (result.data.length === 0) {

            resultElement.textContent =
                "No data found for this ID.";

            return;
        }


        // Clear previous results

        resultElement.innerHTML = "";


        // Create heading

        const heading =
            document.createElement("h3");

        heading.textContent =
            `Data for ${result.userId}`;

        resultElement.appendChild(
            heading
        );


        // Display each record

        result.data.forEach(item => {

            const paragraph =
                document.createElement("p");


            const dataLabel =
                document.createElement("strong");

            dataLabel.textContent =
                "Data: ";


            const createdLabel =
                document.createElement("strong");

            createdLabel.textContent =
                "Created: ";


            paragraph.appendChild(
                dataLabel
            );


            paragraph.appendChild(
                document.createTextNode(
                    item.data
                )
            );


            paragraph.appendChild(
                document.createElement("br")
            );


            paragraph.appendChild(
                createdLabel
            );


            paragraph.appendChild(
                document.createTextNode(
                    new Date(
                        item.createdAt
                    ).toLocaleString()
                )
            );


            resultElement.appendChild(
                paragraph
            );


            resultElement.appendChild(
                document.createElement("hr")
            );

        });

    }

    catch (error) {

        console.error(
            "Error:",
            error
        );

        resultElement.textContent =
            "Could not connect to server.";

    }

}

</script>

</body>

</html>
